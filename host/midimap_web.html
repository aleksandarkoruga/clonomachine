<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sampler MIDI map</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f6fde; --accent-ink: #ffffff; --warn: #b26a00; --warn-bg: #fff4e0; --err: #c0392b;
  --flash: #ffd84d; --ok: #2e8b57; --chip: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9890; --line: #33322e;
    --accent: #6b9cff; --accent-ink: #0d1424; --warn: #f0b04a; --warn-bg: #2d2416; --err: #ff7b6b;
    --flash: #8a7300; --ok: #5cc28a; --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.status { color: var(--muted); font-size: 13px; }
.status.dirty { color: var(--warn); }
.status.ok { color: var(--ok); }
.status.err { color: var(--err); }
.spacer { flex: 1; }
button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:disabled { opacity: .45; cursor: default; }
button.small { padding: 1px 6px; font-size: 12px; }
label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
main { padding: 16px; max-width: 1500px; margin: 0 auto; }
#warnings:empty { display: none; }
#warnings { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 8px;
  padding: 8px 12px; margin-bottom: 14px; }
#warnings li { margin: 2px 0; }
.globals { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 14px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card h2 { margin: 0; padding: 10px 12px; font-size: 15px; display: flex; gap: 8px; align-items: baseline;
  border-bottom: 1px solid var(--line); transition: background .4s; }
.card h2 .sub { color: var(--muted); font-weight: normal; font-size: 13px; }
.card h2 .live { margin-left: auto; font: 12px ui-monospace, monospace; color: var(--muted); }
.fields { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--line); align-items: center; }
.fields label { color: var(--muted); font-size: 12px; text-align: right; }
.fields .f { transition: background .4s; border-radius: 4px; }
select, input[type=number] { font: inherit; padding: 3px 4px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel); color: var(--ink); width: 100%; min-width: 0; }
input[type=number] { width: 64px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 2px 6px; border-bottom: 1px solid var(--line); }
tr.row { transition: background .4s; }
tr.flash, h2.flash, .f.flash { background: var(--flash); transition: none; }
td.cc { width: 52px; font: 13px ui-monospace, monospace; color: var(--muted); text-align: right; }
td.cc.bad { color: var(--err); font-weight: bold; }
td.val { width: 64px; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
td.btns { width: 74px; white-space: nowrap; text-align: right; }
tr.group td { background: var(--chip); color: var(--muted); font-size: 11px; padding: 1px 8px; border-bottom: 0; }
.add { padding: 8px 12px; }
.note { padding: 8px 12px; color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, monospace; }
@media (max-width: 420px) { .fields { grid-template-columns: auto 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Sampler MIDI map</h1>
  <span id="status" class="status">loading...</span>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="live"> live MIDI</label>
  <button id="reload" title="Load the map the board is using">Load from board</button>
  <button id="send" class="primary" disabled title="The board checks it, keeps the old file as /midimap.json.bak, saves and uses it">Send to board</button>
  <button id="defaults" title="The board's built-in map">Defaults</button>
  <button id="export">Export</button>
  <button id="import">Import</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<main>
  <ul id="warnings"></ul>
  <div class="globals">
    <label class="toggle"><input type="checkbox" id="clockFollow"> follow MIDI clock</label>
    <label class="toggle">cutter channel <select id="cutterChannel" style="width:auto"></select></label>
    <span class="mono" id="size"></span>
  </div>
  <div id="cards" class="grid"></div>
</main>
<script>
"use strict";
const VOICES = ["Drums", "Melody", "Third voice"];
const CUTTER_CCS = ["energy", "density", "syncopation", "anchor", "build", "character", "release", "memory", "surprise", "phrase bars", "phrases / section"];
let model = null, names = { controls: [], reverb: [] }, loaded = "", es = null;
const $ = id => document.getElementById(id);

function status(text, cls) { const s = $("status"); s.textContent = text; s.className = "status " + (cls || ""); }

/* the board's JSON, knob lists on one line (it reads any JSON) */
function fmt(o) {
  return JSON.stringify(o, null, 2)
    .replace(/\[\s+("(?:[^"\\]|\\.)*"(?:,\s+"(?:[^"\\]|\\.)*")*)\s+\]/g, (m, inner) => "[" + inner.replace(/,\s+/g, ", ") + "]")
    .replace(/\[\s+(-?[\d.]+),\s+(-?[\d.]+)\s+\]/g, "[$1, $2]");
}
function dirty() { return model && fmt(model) !== loaded; }
function touch() { render(); }

function chanOptions(sel, val, withNone) {
  sel.innerHTML = "";
  if (withNone) sel.add(new Option("none", 0));
  for (let c = 1; c <= 16; ++c) sel.add(new Option(String(c), c));
  sel.value = val;
}
function select(list, val, onchange) {
  const s = document.createElement("select");
  for (const n of list) s.add(new Option(n, n));
  if (!list.includes(val)) s.add(new Option(val, val));
  s.value = val;
  s.onchange = () => { onchange(s.value); touch(); };
  return s;
}
function num(val, min, max, step, onchange) {
  const i = document.createElement("input");
  Object.assign(i, { type: "number", value: val, min, max, step: step || 1 });
  i.onchange = () => { const v = parseFloat(i.value); if (!isNaN(v)) onchange(v); touch(); };
  return i;
}
function btn(text, title, fn) {
  const b = document.createElement("button");
  b.className = "small"; b.textContent = text; b.title = title; b.onclick = () => { fn(); touch(); };
  return b;
}
function field(grid, label, el, key) {
  const l = document.createElement("label"); l.textContent = label;
  const w = document.createElement("div"); w.className = "f"; if (key) w.dataset.key = key; w.append(el);
  grid.append(l, w);
}

/* a CC -> control table: rows in groups of 6 (the Machinedrum's MIDI machine sends 6 at a time) */
function knobTable(card, obj, list, chanKey) {
  const t = document.createElement("table");
  obj.knobs.forEach((k, i) => {
    if (i % 6 === 0) {
      const g = t.insertRow(); g.className = "group";
      const c = g.insertCell(); c.colSpan = 4; c.textContent = `knobs ${i + 1}-${Math.min(i + 6, obj.knobs.length)}`;
    }
    const r = t.insertRow(); r.className = "row"; r.dataset.cc = obj.cc + i;
    const cc = r.insertCell(); cc.className = "cc" + (obj.cc + i > 127 ? " bad" : ""); cc.textContent = obj.cc + i;
    r.insertCell().append(select(list, k, v => obj.knobs[i] = v));
    const val = r.insertCell(); val.className = "val"; val.innerHTML = '<div class="bar"><i></i></div>';
    const b = r.insertCell(); b.className = "btns";
    b.append(btn("▲", "move up", () => { if (i) [obj.knobs[i - 1], obj.knobs[i]] = [obj.knobs[i], obj.knobs[i - 1]]; }),
             btn("▼", "move down", () => { if (i + 1 < obj.knobs.length) [obj.knobs[i + 1], obj.knobs[i]] = [obj.knobs[i], obj.knobs[i + 1]]; }),
             btn("✕", "remove", () => obj.knobs.splice(i, 1)));
  });
  card.append(t);
  const add = document.createElement("div"); add.className = "add";
  add.append(btn("+ control", "add a control on the next CC", () => obj.knobs.push(list[0] === "none" ? list[1] : list[0])));
  card.append(add);
}

function card(title, sub, chan) {
  const c = document.createElement("div"); c.className = "card"; c.dataset.chan = chan;
  const h = document.createElement("h2");
  h.innerHTML = `<span></span><span class="sub"></span><span class="live"></span>`;
  h.children[0].textContent = title; h.children[1].textContent = sub;
  c.append(h);
  return c;
}

function render() {
  if (!model) return;
  $("clockFollow").checked = !!model.clockFollow;
  chanOptions($("cutterChannel"), model.cutterChannel || 0, true);
  const cards = $("cards"); cards.innerHTML = "";
  model.pages.forEach((p, pi) => {
    const c = card(VOICES[p.voice] || ("Voice " + p.voice), `channel ${p.channel}`, p.channel);
    c.dataset.kind = "page"; c.dataset.index = pi;
    const g = document.createElement("div"); g.className = "fields";
    const ch = document.createElement("select"); chanOptions(ch, p.channel); ch.onchange = () => { p.channel = +ch.value; touch(); };
    field(g, "channel", ch);
    const vs = document.createElement("select"); VOICES.forEach((v, i) => vs.add(new Option(v, i))); vs.value = p.voice;
    vs.onchange = () => { p.voice = +vs.value; touch(); };
    field(g, "voice", vs);
    field(g, "first CC", num(p.cc, 0, 127, 1, v => p.cc = v));
    const rate = document.createElement("span");
    rate.append(num(p.rate[0], -8, 8, 0.25, v => p.rate[0] = v), " ", num(p.rate[1], -8, 8, 0.25, v => p.rate[1] = v));
    field(g, "rate", rate);
    field(g, "velocity", select(names.controls, p.velocity || "volume", v => p.velocity = v), "vel");
    const no = document.createElement("input"); no.type = "checkbox"; no.checked = p.noteOff !== false;
    no.onchange = () => { p.noteOff = no.checked; touch(); };
    field(g, "note-off cuts", no);
    field(g, "mod wheel", select(names.controls, p.mw, v => p.mw = v), "mw");
    field(g, "aftertouch", select(names.controls, p.at, v => p.at = v), "at");
    field(g, "pitch bend", select(names.controls, p.pb, v => p.pb = v), "pb");
    c.append(g);
    knobTable(c, p, names.controls);
    cards.append(c);
  });
  const rv = model.reverb;
  if (rv) {
    const c = card("Plate reverb", rv.channel ? `channel ${rv.channel}` : "off", rv.channel);
    c.dataset.kind = "reverb";
    const g = document.createElement("div"); g.className = "fields";
    const ch = document.createElement("select"); chanOptions(ch, rv.channel, true); ch.onchange = () => { rv.channel = +ch.value; touch(); };
    field(g, "channel", ch);
    field(g, "first CC", num(rv.cc, 0, 127, 1, v => rv.cc = v));
    field(g, "mod wheel", select(names.reverb, rv.mw, v => rv.mw = v), "mw");
    field(g, "aftertouch", select(names.reverb, rv.at, v => rv.at = v), "at");
    field(g, "pitch bend", select(names.reverb, rv.pb, v => rv.pb = v), "pb");
    c.append(g);
    knobTable(c, rv, names.reverb);
    cards.append(c);
  }
  if (model.cutterChannel) {
    const c = card("Break cutter (ESP32)", `channel ${model.cutterChannel}`, model.cutterChannel);
    c.dataset.kind = "cutter";
    const t = document.createElement("table");
    CUTTER_CCS.forEach((n, i) => {
      const r = t.insertRow(); r.className = "row"; r.dataset.cc = 16 + i;
      const cc = r.insertCell(); cc.className = "cc"; cc.textContent = 16 + i;
      r.insertCell().textContent = n;
      const val = r.insertCell(); val.className = "val"; val.innerHTML = '<div class="bar"><i></i></div>';
    });
    c.append(t);
    const n = document.createElement("div"); n.className = "note";
    n.textContent = "Set in the ESP's firmware. Mod wheel: release · notes: presets · pitch bend above the centre: the conductor plays the form.";
    c.append(n);
    cards.append(c);
  }
  checks();
}

function checks() {
  const w = [], used = new Map(); // "chan:cc" -> owner
  const claim = (ch, cc, who) => { const k = ch + ":" + cc; if (used.has(k)) w.push(`channel ${ch} CC ${cc}: ${used.get(k)} and ${who}`); else used.set(k, who); };
  const whole = new Map();
  if (model.cutterChannel) whole.set(model.cutterChannel, "the cutter");
  if (model.reverb && model.reverb.channel) {
    if (whole.has(model.reverb.channel)) w.push(`channel ${model.reverb.channel}: the reverb and the cutter (the reverb wins)`);
    whole.set(model.reverb.channel, "the reverb");
  }
  const firstOn = new Map();
  model.pages.forEach(p => {
    const who = VOICES[p.voice] || ("voice " + p.voice);
    if (whole.has(p.channel)) w.push(`${who} on channel ${p.channel} is unreachable: ${whole.get(p.channel)} takes the whole channel`);
    if (firstOn.has(p.channel)) w.push(`${who} shares channel ${p.channel} with ${firstOn.get(p.channel)}: notes only go to ${firstOn.get(p.channel)}`);
    else firstOn.set(p.channel, who);
    p.knobs.forEach((k, i) => { if (k !== "none") claim(p.channel, p.cc + i, `${who} ${k}`); if (p.cc + i > 127) w.push(`${who}: ${k} would be CC ${p.cc + i}`); });
    if (p.mw !== "none" && p.cc <= 1 && p.cc + p.knobs.length > 1) w.push(`${who}: CC 1 is the mod wheel (${p.mw}) and a knob`);
  });
  const rv = model.reverb;
  if (rv && rv.channel) rv.knobs.forEach((k, i) => { if (rv.cc + i > 127) w.push(`reverb: ${k} would be CC ${rv.cc + i}`); });
  const size = new TextEncoder().encode(fmt(model)).length;
  if (size > 8000) w.push(`the map is ${size} bytes, the board takes 8000`);
  $("size").textContent = `${size} bytes`;
  $("warnings").innerHTML = "";
  for (const s of w) { const li = document.createElement("li"); li.textContent = s; $("warnings").append(li); }
  $("send").disabled = !dirty();
  if (dirty()) status("changed, not sent", "dirty");
}

async function load() {
  status("loading from the board...");
  try {
    const r = await fetch("/api/map"); const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    model = j.map; names = j.names; loaded = fmt(model);
    render(); status("as on the board", "ok");
  } catch (e) { status("could not load: " + e.message, "err"); }
}

async function send() {
  status("sending...");
  try {
    const r = await fetch("/api/map", { method: "POST", body: fmt(model) }); const j = await r.json();
    if (!j.ok) throw new Error(j.message);
    await load(); status("sent: " + j.message, "ok");
  } catch (e) { status("not sent: " + e.message, "err"); }
}

/* live MIDI: the row, field or card the message drives lights up */
function flash(el) { if (!el) return; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 60); }
function onMidi(ev) {
  const type = ev.st & 0xF0, ch = ev.ch;
  document.querySelectorAll(`.card[data-chan="${ch}"]`).forEach(c => {
    const h = c.querySelector("h2"), live = h.querySelector(".live");
    if (type === 0xB0) {
      if (ev.d1 === 1 && c.dataset.kind !== "cutter") { flash(c.querySelector('[data-key="mw"]')); live.textContent = `MW ${ev.d2}`; return; }
      const r = c.querySelector(`tr.row[data-cc="${ev.d1}"]`);
      if (r) { flash(r); r.querySelector(".bar i").style.width = (ev.d2 / 127 * 100) + "%"; }
      live.textContent = `CC ${ev.d1} = ${ev.d2}`;
    } else if (type === 0x90 && ev.d2) { flash(h); live.textContent = `note ${ev.d1} vel ${ev.d2}`; flash(c.querySelector('[data-key="vel"]')); }
    else if (type === 0xE0) { flash(c.querySelector('[data-key="pb"]')); live.textContent = `PB ${ev.d2}`; }
    else if (type === 0xD0) { flash(c.querySelector('[data-key="at"]')); live.textContent = `AT ${ev.d1}`; }
  });
}
async function setLive(on) {
  await fetch("/api/monitor", { method: "POST", body: JSON.stringify({ on }) });
  if (on && !es) { es = new EventSource("/api/events"); es.onmessage = m => onMidi(JSON.parse(m.data)); }
  if (!on && es) { es.close(); es = null; }
}

$("reload").onclick = () => { if (!dirty() || confirm("Drop the changes and load the board's map?")) load(); };
$("send").onclick = send;
$("defaults").onclick = async () => {
  if (!confirm("Replace the board's map with its built-in defaults? (the current file stays as /midimap.json.bak)")) return;
  await fetch("/api/defaults", { method: "POST" }); load();
};
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([fmt(model)], { type: "application/json" }));
  a.download = "midimap.json"; a.click();
};
$("import").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0]; if (!f) return;
  try { model = JSON.parse(await f.text()); render(); } catch (e) { status("not a JSON file: " + e.message, "err"); }
  $("file").value = "";
};
$("clockFollow").onchange = () => { model.clockFollow = $("clockFollow").checked; touch(); };
$("cutterChannel").onchange = () => { model.cutterChannel = +$("cutterChannel").value; touch(); };
$("live").onchange = () => setLive($("live").checked);
window.addEventListener("beforeunload", e => { if (dirty()) e.preventDefault(); if (es) navigator.sendBeacon("/api/monitor", JSON.stringify({ on: false })); });
load();
</script>
</body>
</html>
